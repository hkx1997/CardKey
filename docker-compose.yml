# CardKey 全栈：Postgres + Redis + API（端口与密码均可通过 .env 配置）
# 项目名固定，避免换目录导致 project 前缀变化、挂上新空卷
name: cardkey

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cardkey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardkey}
      POSTGRES_DB: ${POSTGRES_DB:-cardkey}
    volumes:
      # 卷名可用 .env 覆盖以挂接旧数据，见 deploy/DATA_SAFETY.md
      - type: volume
        source: postgres_data
        target: /var/lib/postgresql/data
        volume: {}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    # 重启策略：升级应用时尽量不重建本服务
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - type: volume
        source: redis_data
        target: /data
        volume: {}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  cardkey:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-cardkey}:${POSTGRES_PASSWORD:-cardkey}@postgres:5432/${POSTGRES_DB:-cardkey}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CONTENT_KEY: ${CONTENT_KEY:?set CONTENT_KEY in .env}
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-}
      BOOTSTRAP_ADMIN_PASS: ${BOOTSTRAP_ADMIN_PASS:-}
      PUBLIC_REDEEM_API_KEY: ${PUBLIC_REDEEM_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${APP_PORT:-18080},http://127.0.0.1:${APP_PORT:-18080},http://localhost:5173,http://127.0.0.1:5173}
      APP_ENV: ${APP_ENV:-production}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      CSRF_CHECK: ${CSRF_CHECK:-true}
      REQUIRE_REDIS: ${REQUIRE_REDIS:-true}
      REQUIRE_REDEEM_API_KEY: ${REQUIRE_REDEEM_API_KEY:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      UPDATE_MODE: ${UPDATE_MODE:-docker}
      UPDATE_GITHUB_OWNER: ${UPDATE_GITHUB_OWNER:-hkx1997}
      UPDATE_GITHUB_REPO: ${UPDATE_GITHUB_REPO:-CardKey}
      UPDATE_GITHUB_TOKEN: ${UPDATE_GITHUB_TOKEN:-}
      # 留空：自动用进程路径 os.Executable()；勿写 /opt/cardkey/...
      UPDATE_BINARY_PATH: ${UPDATE_BINARY_PATH:-}
      UPDATE_RELEASES_DIR: ${UPDATE_RELEASES_DIR:-}
      MIGRATIONS_DIR: /app/migrations
      STATIC_DIR: /app/static
      DATA_DIR: /app/data
    volumes:
      - type: volume
        source: cardkey_data
        target: /app/data
        volume: {}
    ports:
      - "${APP_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend-mock:
    profiles: ["mock"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: mock
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped

# 固定外部可识别卷名；升级时用 scripts/upgrade.sh 只重建 cardkey，不碰 postgres
# 若你旧数据在别的卷名，在 .env 设置：
#   POSTGRES_VOLUME_NAME=旧卷名
#   APP_VOLUME_NAME=旧卷名
#   REDIS_VOLUME_NAME=旧卷名
volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-cardkey_postgres_data}
  cardkey_data:
    name: ${APP_VOLUME_NAME:-cardkey_app_data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-cardkey_redis_data}

# CardKey 全栈：Postgres + Redis + API（端口与密码均可通过 .env 配置）
name: cardkey

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cardkey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardkey}
      POSTGRES_DB: ${POSTGRES_DB:-cardkey}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 仅绑定本机环回，避免公网扫库（需远程访问请用 SSH 隧道）
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  cardkey:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-cardkey}:${POSTGRES_PASSWORD:-cardkey}@postgres:5432/${POSTGRES_DB:-cardkey}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # 生产必须在 .env 中设置强随机 JWT_SECRET / CONTENT_KEY（见 deploy/docker-deploy.sh）
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CONTENT_KEY: ${CONTENT_KEY:?set CONTENT_KEY in .env}
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-}
      BOOTSTRAP_ADMIN_PASS: ${BOOTSTRAP_ADMIN_PASS:-}
      PUBLIC_REDEEM_API_KEY: ${PUBLIC_REDEEM_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${APP_PORT:-18080},http://127.0.0.1:${APP_PORT:-18080},http://localhost:5173,http://127.0.0.1:5173}
      APP_ENV: ${APP_ENV:-production}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      CSRF_CHECK: ${CSRF_CHECK:-true}
      REQUIRE_REDIS: ${REQUIRE_REDIS:-true}
      REQUIRE_REDEEM_API_KEY: ${REQUIRE_REDEEM_API_KEY:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      UPDATE_MODE: ${UPDATE_MODE:-docker}
      UPDATE_GITHUB_OWNER: ${UPDATE_GITHUB_OWNER:-hkx1997}
      UPDATE_GITHUB_REPO: ${UPDATE_GITHUB_REPO:-CardKey}
      UPDATE_GITHUB_TOKEN: ${UPDATE_GITHUB_TOKEN:-}
      MIGRATIONS_DIR: /app/migrations
      STATIC_DIR: /app/static
      DATA_DIR: /app/data
    volumes:
      - cardkey_data:/app/data
    ports:
      - "${APP_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 在线更新会 os.Exit(0)，依赖策略自动拉起（容器可写层已替换二进制）
    restart: unless-stopped

  frontend-mock:
    profiles: ["mock"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: mock
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped

# 固定卷名：避免因目录改名 / project name 变化产生新空卷导致「数据丢失」假象
volumes:
  postgres_data:
    name: cardkey_postgres_data
  cardkey_data:
    name: cardkey_app_data

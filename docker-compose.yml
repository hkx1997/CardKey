# CardKey 全栈：Postgres + Redis + API（端口与密码均可通过 .env 配置）
name: cardkey

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cardkey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cardkey}
      POSTGRES_DB: ${POSTGRES_DB:-cardkey}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  cardkey:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-cardkey}:${POSTGRES_PASSWORD:-cardkey}@postgres:5432/${POSTGRES_DB:-cardkey}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-cardkey-local-dev-jwt-secret-please-rotate-xx}
      CONTENT_KEY: ${CONTENT_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      # 留空 BOOTSTRAP_ADMIN_PASS → 首次打开 /admin/setup 向导创建管理员
      BOOTSTRAP_ADMIN_USER: ${BOOTSTRAP_ADMIN_USER:-}
      BOOTSTRAP_ADMIN_PASS: ${BOOTSTRAP_ADMIN_PASS:-}
      PUBLIC_REDEEM_API_KEY: ${PUBLIC_REDEEM_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${APP_PORT:-18080},http://127.0.0.1:${APP_PORT:-18080},http://localhost:5173,http://127.0.0.1:5173}
      APP_ENV: ${APP_ENV:-production}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      CSRF_CHECK: ${CSRF_CHECK:-false}
      REQUIRE_REDEEM_API_KEY: ${REQUIRE_REDEEM_API_KEY:-false}
      UPDATE_MODE: ${UPDATE_MODE:-disabled}
      UPDATE_GITHUB_OWNER: ${UPDATE_GITHUB_OWNER:-}
      UPDATE_GITHUB_REPO: ${UPDATE_GITHUB_REPO:-}
      UPDATE_GITHUB_TOKEN: ${UPDATE_GITHUB_TOKEN:-}
      MIGRATIONS_DIR: /app/migrations
      STATIC_DIR: /app/static
      DATA_DIR: /app/data
    volumes:
      - cardkey_data:/app/data
    ports:
      - "${APP_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend-mock:
    profiles: ["mock"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: mock
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  postgres_data:
  cardkey_data:

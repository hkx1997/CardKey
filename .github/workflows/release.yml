name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Read version
        id: ver
        run: |
          V=$(tr -d ' \t\r\n' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building $V for tag ${GITHUB_REF_NAME}"

      - name: Build binaries
        working-directory: backend
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p ../dist
          COMMIT="${GITHUB_SHA::7}"
          BT="$(date -u +%Y-%m-%dT%H:%MZ)"
          LDFLAGS="-s -w -X github.com/cardkey/cardkey/internal/version.Version=${VERSION} -X github.com/cardkey/cardkey/internal/version.Commit=${COMMIT} -X github.com/cardkey/cardkey/internal/version.BuildTime=${BT}"
          for pair in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64"; do
            set -- $pair
            GOOS=$1 GOARCH=$2
            OUT="../dist/cardkey-${GOOS}-${GOARCH}"
            if [ "$GOOS" = "windows" ]; then OUT="${OUT}.exe"; fi
            echo "→ $OUT"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="$LDFLAGS" -o "$OUT" ./cmd/cardkey
          done
          cd ../dist
          sha256sum cardkey-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CardKey ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/cardkey-linux-amd64
            dist/cardkey-linux-arm64
            dist/cardkey-darwin-amd64
            dist/cardkey-darwin-arm64
            dist/cardkey-windows-amd64.exe
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

# 对齐 Docker 部署为主：Release 只打 tag + 说明，不附带各平台二进制包。
# 升级：git checkout <tag> && docker compose up -d --build
# 或：bash scripts/upgrade.sh

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release (notes only)
        uses: softprops/action-gh-release@v2
        with:
          name: CardKey ${{ github.ref_name }}
          generate_release_notes: true
          # 不上传 files —— 无多平台二进制
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

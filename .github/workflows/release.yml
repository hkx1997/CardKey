name: Release

# Docker 一键更新需要 Linux 资产：后端 + 嵌入 SPA + 迁移
# 仅上传 linux-amd64 / linux-arm64 + checksums（不附带 Windows/macOS）
# 空壳包（约 11–12MB、未 embed 前端）会导致线上 502 / UI 不更新 —— 本流水线强制 ≥13MB
#
# 防覆盖：若 tag 上已有 ≥13MB 的完整 amd64 资产，且本流水线产物更小，则只更新 notes、不覆盖二进制
# （避免本机 release.sh 已上传完整包后，CI 再以次品覆盖）

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Version
        id: ver
        run: |
          V=$(tr -d ' \t\r\n' < VERSION)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building CardKey $V"

      - name: Build frontend (embed SPA)
        working-directory: frontend
        env:
          VITE_API_MODE: http
          VITE_APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test -f dist/index.html
          test -d dist/assets
          ASSETS=$(find dist/assets -type f | wc -l)
          echo "frontend assets=$ASSETS"
          test "$ASSETS" -ge 5

      - name: Copy SPA into webstatic embed
        run: |
          rm -rf backend/internal/webstatic/dist
          mkdir -p backend/internal/webstatic/dist
          cp -a frontend/dist/. backend/internal/webstatic/dist/
          test -f backend/internal/webstatic/dist/index.html
          test -d backend/internal/webstatic/dist/assets
          CSS=$(ls backend/internal/webstatic/dist/assets/index-*.css | head -1)
          JS=$(ls backend/internal/webstatic/dist/assets/index-*.js | head -1)
          test -n "$CSS" && test -n "$JS"
          echo "CSS=$CSS" >> "$GITHUB_ENV"
          echo "JS=$JS" >> "$GITHUB_ENV"
          echo "embed markers: CSS=$CSS JS=$JS"

      - name: Build Linux binaries
        working-directory: backend
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p ../dist
          COMMIT="${GITHUB_SHA::7}"
          BT="$(date -u +%Y-%m-%dT%H:%MZ)"
          LDFLAGS="-s -w -X github.com/cardkey/cardkey/internal/version.Version=${VERSION} -X github.com/cardkey/cardkey/internal/version.Commit=${COMMIT} -X github.com/cardkey/cardkey/internal/version.BuildTime=${BT}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o ../dist/cardkey-linux-amd64 ./cmd/cardkey
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o ../dist/cardkey-linux-arm64 ./cmd/cardkey
          cd ../dist
          sha256sum cardkey-linux-* > checksums.txt
          ls -la

      - name: Gate binary size and SPA embed
        run: |
          set -euo pipefail
          for bin in dist/cardkey-linux-amd64 dist/cardkey-linux-arm64; do
            sz=$(wc -c <"$bin" | tr -d ' ')
            echo "$bin size=$sz"
            if [ "$sz" -lt 13000000 ]; then
              echo "FAIL: $bin too small ($sz) — empty shell without SPA" >&2
              exit 1
            fi
          done
          python3 - <<'PY'
          import pathlib, sys, glob
          bin_path = pathlib.Path("dist/cardkey-linux-amd64")
          data = bin_path.read_bytes()
          css_files = glob.glob("backend/internal/webstatic/dist/assets/index-*.css")
          js_files = glob.glob("backend/internal/webstatic/dist/assets/index-*.js")
          if not css_files or not js_files:
              raise SystemExit("missing index css/js for embed check")
          css = pathlib.Path(css_files[0]).read_bytes()[:120]
          js = pathlib.Path(js_files[0]).read_bytes()[:120]
          ok = True
          if css not in data:
              print("FAIL: CSS payload missing in binary", file=sys.stderr)
              ok = False
          if js not in data:
              print("FAIL: JS payload missing in binary", file=sys.stderr)
              ok = False
          if b"index-" not in data:
              print("FAIL: no index- asset name in binary", file=sys.stderr)
              ok = False
          if not ok:
              raise SystemExit(1)
          print("OK embed gate", bin_path, "size", len(data))
          PY

      - name: Decide whether to upload binaries
        id: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NEW=$(wc -c < dist/cardkey-linux-amd64 | tr -d ' ')
          REMOTE=0
          if gh release view "$TAG" >/dev/null 2>&1; then
            REMOTE=$(gh api "repos/${{ github.repository }}/releases/tags/${TAG}" \
              --jq '[.assets[] | select(.name=="cardkey-linux-amd64") | .size] | first // 0' || echo 0)
          fi
          echo "new_amd64=$NEW remote_amd64=$REMOTE"
          # 已有完整资产且本构建更小 → 不覆盖（保护本机 release.sh 先传的完整包）
          if [ "${REMOTE:-0}" -ge 13000000 ] && [ "$NEW" -lt "$REMOTE" ]; then
            echo "skip_binaries=true" >> "$GITHUB_OUTPUT"
            echo "KEEP existing full assets (remote=$REMOTE > new=$NEW)"
          else
            echo "skip_binaries=false" >> "$GITHUB_OUTPUT"
            echo "Will upload CI binaries (new=$NEW remote=$REMOTE)"
          fi

      - name: Create/Update GitHub Release (with binaries)
        if: steps.upload.outputs.skip_binaries != 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: CardKey ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/cardkey-linux-amd64
            dist/cardkey-linux-arm64
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create/Update GitHub Release (notes only, keep assets)
        if: steps.upload.outputs.skip_binaries == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: CardKey ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify remote asset sizes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sleep 3
          python3 - <<'PY'
          import json, os, subprocess, sys
          tag = os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          out = subprocess.check_output(
              ["gh", "api", f"repos/{repo}/releases/tags/{tag}"],
              text=True,
          )
          rel = json.loads(out)
          assets = {a["name"]: a["size"] for a in rel.get("assets", [])}
          print("remote assets:", assets)
          ok = True
          for name in ("cardkey-linux-amd64", "cardkey-linux-arm64"):
              sz = int(assets.get(name) or 0)
              if sz < 13_000_000:
                  print(f"FAIL: remote {name} size={sz} < 13MB", file=sys.stderr)
                  ok = False
              else:
                  print(f"OK remote {name}={sz}")
          if not ok:
              raise SystemExit(1)
          print("OK remote size gate")
          PY
